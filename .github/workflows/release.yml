# After every merge to main: tag the next version (vX.Y.Z) from the
# Conventional Commit subjects since the last tag (scripts/release.ts):
# feat → minor, fix/perf/refactor → patch, `!` / BREAKING CHANGE → major,
# chore/ci/docs/test only → no tag. App repos pin the workflows by commit
# with a `# vX.Y.Z` comment; their Dependabot opens the update PR when a new
# tag appears, and flutter-project-kit's weekly job bumps its templates.
name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag the next version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # create the tag (through the API; nothing is pushed)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # every tag and the commits since the last one
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx tsx scripts/release.ts
