# Reusable workflow: the weekly credential check. Runs every enabled
# platform's read-only check, so an expired or revoked token shows up days
# before a release, not on release day. While anything fails it keeps one
# issue open (label social-credentials) and updates it each week; it closes
# the issue once everything works. Threads' 60-day token is refreshed and
# saved each run (with SOCIAL_SECRETS_TOKEN), so it never runs out.
# Called from each app repo by examples/social-health.yml.
name: Social credentials check

on:
  workflow_call:
    inputs:
      platforms:
        description: Same list as the publish workflow's platforms input
        type: string
        default: facebook,instagram,linkedin,youtube,tiktok
      linkedin_as:
        type: string
        default: person
      linkedin_version:
        type: string
        default: '202609'
      facebook_graph_version:
        type: string
        default: v24.0
      open_issue:
        description: Open / update / close the social-credentials issue
        type: boolean
        default: true
      threads_token_repos:
        description: Repos (owner/name, comma-separated) whose THREADS_TOKEN gets the refreshed token. Empty = this repo.
        type: string
        default: ''
    secrets:
      FB_PAGE_ID:
        required: false
      FB_PAGE_TOKEN:
        required: false
      IG_USER_ID:
        required: false
      LINKEDIN_TOKEN:
        required: false
      LINKEDIN_AUTHOR_URN:
        required: false
      LINKEDIN_ORG_URN:
        required: false
      LINKEDIN_CLIENT_ID:
        required: false
      LINKEDIN_CLIENT_SECRET:
        required: false
      LINKEDIN_REFRESH_TOKEN:
        required: false
      YT_CLIENT_ID:
        required: false
      YT_CLIENT_SECRET:
        required: false
      YT_REFRESH_TOKEN:
        required: false
      TIKTOK_CLIENT_KEY:
        required: false
      TIKTOK_CLIENT_SECRET:
        required: false
      TIKTOK_REFRESH_TOKEN:
        required: false
      THREADS_USER_ID:
        required: false
      THREADS_TOKEN:
        required: false
      BLUESKY_HANDLE:
        required: false
      BLUESKY_APP_PASSWORD:
        required: false
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false
      X_API_KEY:
        required: false
      X_API_SECRET:
        required: false
      X_ACCESS_TOKEN:
        required: false
      X_ACCESS_SECRET:
        required: false
      SOCIAL_SECRETS_TOKEN:
        description: Fine-grained GitHub token with Secrets read/write on the app repos; saves the refreshed Threads token
        required: false

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check credentials
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write   # the social-credentials issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: publisher
          persist-credentials: false
      - uses: ./publisher/.github/actions/setup # zizmor: ignore[self-repository] publisher/ is this repo, checked out above at job.workflow_sha; ./ would be the app repo
      - name: Check
        working-directory: publisher
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLATFORMS: ${{ inputs.platforms }}
          OPEN_ISSUE: ${{ inputs.open_issue }}
          LINKEDIN_AS: ${{ inputs.linkedin_as }}
          LINKEDIN_VERSION: ${{ inputs.linkedin_version }}
          FB_GRAPH_VERSION: ${{ inputs.facebook_graph_version }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          LINKEDIN_ORG_URN: ${{ secrets.LINKEDIN_ORG_URN }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          SOCIAL_SECRETS_TOKEN: ${{ secrets.SOCIAL_SECRETS_TOKEN }}
          # Outside anything uploaded: the refreshed Threads token.
          THREADS_NEW_TOKEN_FILE: ${{ runner.temp }}/threads-token
        run: npx tsx scripts/health.ts
      - name: Save the refreshed Threads token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.SOCIAL_SECRETS_TOKEN }}
          REPOS: ${{ inputs.threads_token_repos || github.repository }}
          THREADS_NEW_TOKEN_FILE: ${{ runner.temp }}/threads-token
        run: |
          if [ ! -s "$THREADS_NEW_TOKEN_FILE" ]; then
            echo "No Threads token refresh happened; nothing to save."
            exit 0
          fi
          status=0
          IFS=',' read -ra repos <<< "$REPOS"
          for repo in "${repos[@]}"; do
            repo="$(echo "$repo" | tr -d '[:space:]')"
            [ -n "$repo" ] || continue
            if gh secret set THREADS_TOKEN --repo "$repo" < "$THREADS_NEW_TOKEN_FILE" > /dev/null; then
              echo "Saved the refreshed THREADS_TOKEN in $repo."
            else
              echo "::error::Couldn't save THREADS_TOKEN in $repo. Check SOCIAL_SECRETS_TOKEN (Secrets: read and write on $repo). The old token still works until it expires."
              status=1
            fi
          done
          rm -f "$THREADS_NEW_TOKEN_FILE"
          exit "$status"
