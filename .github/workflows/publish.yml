# Reusable workflow: announce an app update on LinkedIn, a Facebook Page,
# Instagram (a Reel), YouTube and TikTok (the video lands in your TikTok
# inbox as a draft), and on Threads when you turn it on. Called from each app repo by a small .github/workflows/social.yml
# (examples/social.yml). docs/ has the full setup (docs/app-repo.md).
#
# Posts are written by Claude Code on your Claude plan (CLAUDE_CODE_OAUTH_TOKEN),
# the API (ANTHROPIC_API_KEY) or, with neither, fixed templates (no AI).
#
#   generate ─► approve (environment "social": you review the posts) ─┬─► facebook ─┐
#                                                                     ├─► instagram┤
#   (collect, write posts with Claude, find video,                    ├─► linkedin ─┤
#    check credentials; job summary = review page)                    ├─► youtube  ─┼─► summary
#                                                                     └─► tiktok   ─┘
#
# Dry run (the default): only `generate` and `summary` run; nothing is posted.
# Each platform job may fail without stopping the others. A platform that has
# posted an update is tagged social/posted/<key>/<channel>, so it never posts
# the same update twice.
name: Publish to social media

on:
  workflow_call:
    inputs:
      app_name:
        description: App name as users know it
        type: string
        required: true
      play_store_url:
        type: string
        default: ''
      app_store_url:
        type: string
        default: ''
      website_url:
        type: string
        default: ''
      about:
        description: One or two sentences about the app and its users (helps the writing)
        type: string
        default: ''
      voice:
        description: Optional style notes for the posts
        type: string
        default: ''
      platforms:
        description: Comma-separated subset of facebook,instagram,linkedin,youtube,tiktok,threads (the last ones are opt-in)
        type: string
        default: facebook,instagram,linkedin,youtube,tiktok
      languages:
        description: Comma-separated language codes, first is the main one (en,ar)
        type: string
        default: en
      linkedin_as:
        description: person, organization or both
        type: string
        default: person
      linkedin_version:
        description: LinkedIn-Version header (YYYYMM); LinkedIn supports each version for a year
        type: string
        default: '202609'
      facebook_graph_version:
        type: string
        default: v24.0
      youtube_privacy:
        description: private, unlisted or public (stays private until your project passes YouTube's audit)
        type: string
        default: private
      youtube_audited:
        description: Set to true once your Google Cloud project has passed YouTube's API audit
        type: boolean
        default: false
      tiktok_token_repos:
        description: >-
          Repos (owner/name, comma-separated) whose TIKTOK_REFRESH_TOKEN secret
          gets the new token after each run (TikTok rotates it). Empty = this
          repo. List every repo that shares the TikTok account.
        type: string
        default: ''
      release_tag:
        description: Release to post about. Empty = the triggering or latest release; "changes" = commits since the last post
        type: string
        default: ''
      biweekly:
        description: On schedule runs, skip odd ISO weeks (run the caller weekly)
        type: boolean
        default: true
      include_prereleases:
        type: boolean
        default: false
      dry_run:
        description: Generate and show the posts, publish nothing
        type: boolean
        default: true
      force:
        description: Post again even if this update was already posted
        type: boolean
        default: false
      environment:
        description: Environment whose required reviewers approve the posts
        type: string
        default: social
      require_approval:
        description: Refuse to post when the environment has no required reviewers
        type: boolean
        default: true
      writer:
        description: >-
          Who writes the posts: auto (Claude Code on your Claude plan when
          CLAUDE_CODE_OAUTH_TOKEN is set, else the API when ANTHROPIC_API_KEY
          is set, else templates), claude-code, api or template (no AI)
        type: string
        default: auto
      hashtags:
        description: Hashtags for template posts, comma-separated (e.g. Flutter,MobileApps)
        type: string
        default: ''
      model:
        type: string
        default: claude-sonnet-5-5
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: From `claude setup-token` (Pro/Max plan, ~1 year); writes posts on your plan
        required: false
      ANTHROPIC_API_KEY:
        description: Optional; writes posts through the API (needs API credit)
        required: false
      FB_PAGE_ID:
        required: false
      FB_PAGE_TOKEN:
        description: Long-lived Page token; for Instagram it also needs instagram_basic and instagram_content_publish
        required: false
      IG_USER_ID:
        description: The Instagram professional account linked to the Page (17841…)
        required: false
      LINKEDIN_TOKEN:
        required: false
      LINKEDIN_AUTHOR_URN:
        required: false
      LINKEDIN_ORG_URN:
        required: false
      LINKEDIN_CLIENT_ID:
        required: false
      LINKEDIN_CLIENT_SECRET:
        required: false
      LINKEDIN_REFRESH_TOKEN:
        required: false
      YT_CLIENT_ID:
        required: false
      YT_CLIENT_SECRET:
        required: false
      YT_REFRESH_TOKEN:
        required: false
      TIKTOK_CLIENT_KEY:
        required: false
      TIKTOK_CLIENT_SECRET:
        required: false
      TIKTOK_REFRESH_TOKEN:
        required: false
      THREADS_USER_ID:
        required: false
      THREADS_TOKEN:
        description: Long-lived Threads token (60 days; the weekly credential check refreshes it)
        required: false
      SOCIAL_SECRETS_TOKEN:
        description: Fine-grained GitHub token with Secrets read/write on the app repos; saves TikTok's rotated refresh token
        required: false
    outputs:
      skipped:
        description: true when there was nothing to post
        value: ${{ jobs.generate.outputs.skip }}

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  generate:
    name: Generate posts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read     # check the approval environment's reviewers
    outputs:
      skip: ${{ steps.result.outputs.skip }}
      key: ${{ steps.collect.outputs.key }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      SOCIAL_OUT: ${{ github.workspace }}/out
      APP_DIR: ${{ github.workspace }}/app
      PLATFORMS: ${{ inputs.platforms }}
      DRY_RUN: ${{ inputs.dry_run }}
      FORCE: ${{ inputs.force }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app
          fetch-depth: 0   # commits and tags since the last post
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The scripts from the same commit as this workflow file (the one
          # the app repo pinned), not from the app repo.
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: publisher
          persist-credentials: false

      - uses: ./publisher/.github/actions/setup # zizmor: ignore[self-repository] publisher/ is this repo, checked out above at job.workflow_sha; ./ would be the app repo

      - name: What to post about
        id: collect
        working-directory: publisher
        env:
          EVENT_NAME: ${{ github.event_name }}
          APP_NAME: ${{ inputs.app_name }}
          PLAY_STORE_URL: ${{ inputs.play_store_url }}
          APP_STORE_URL: ${{ inputs.app_store_url }}
          WEBSITE_URL: ${{ inputs.website_url }}
          ABOUT: ${{ inputs.about }}
          LANGUAGES: ${{ inputs.languages }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          BIWEEKLY: ${{ inputs.biweekly }}
          INCLUDE_PRERELEASES: ${{ inputs.include_prereleases }}
          LINKEDIN_AS: ${{ inputs.linkedin_as }}
        run: npx tsx scripts/collect.ts

      - name: Write the posts
        id: generate
        if: steps.collect.outputs.skip != 'true'
        working-directory: publisher
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WRITER: ${{ inputs.writer }}
          HASHTAGS: ${{ inputs.hashtags }}
          MODEL: ${{ inputs.model }}
          VOICE: ${{ inputs.voice }}
        run: npx tsx scripts/generate.ts

      - name: Find the video
        if: steps.collect.outputs.skip != 'true' && steps.generate.outputs.skip != 'true'
        working-directory: publisher
        run: npx tsx scripts/media.ts

      - name: Check credentials
        if: steps.collect.outputs.skip != 'true' && steps.generate.outputs.skip != 'true'
        working-directory: publisher
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          REQUIRE_APPROVAL: ${{ inputs.require_approval }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_GRAPH_VERSION: ${{ inputs.facebook_graph_version }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          LINKEDIN_AS: ${{ inputs.linkedin_as }}
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          LINKEDIN_ORG_URN: ${{ secrets.LINKEDIN_ORG_URN }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ inputs.youtube_privacy }}
          YT_AUDITED: ${{ inputs.youtube_audited }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          SOCIAL_SECRETS_TOKEN: ${{ secrets.SOCIAL_SECRETS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: npx tsx scripts/preflight.ts

      - name: Result
        id: result
        env:
          COLLECT_SKIP: ${{ steps.collect.outputs.skip }}
          GENERATE_SKIP: ${{ steps.generate.outputs.skip }}
        run: |
          if [ "$COLLECT_SKIP" = true ] || [ "$GENERATE_SKIP" = true ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # The review copy: posts.md/posts.json, plus the video the jobs upload.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: social-posts
          path: out
          if-no-files-found: ignore
          retention-days: 30

  approve:
    name: Approve posts
    needs: generate
    if: ${{ !inputs.dry_run && needs.generate.outputs.skip == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    # The job waits here until a required reviewer approves (Actions → this
    # run → Review deployments). Read the posts in the Generate job's summary
    # first. Rejecting (or letting it time out after 30 days) posts nothing.
    environment:
      name: ${{ inputs.environment }}
    steps:
      - run: echo "Approved, posting."

  facebook:
    name: Facebook
    needs: [generate, approve]
    if: ${{ needs.approve.result == 'success' && contains(inputs.platforms, 'facebook') }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # tag social/posted/<key>/facebook
    env:
      GITHUB_TOKEN: ${{ github.token }}
      SOCIAL_OUT: ${{ github.workspace }}/out
      DRY_RUN: ${{ inputs.dry_run }}
      FORCE: ${{ inputs.force }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: publisher
          persist-credentials: false
      - uses: ./publisher/.github/actions/setup # zizmor: ignore[self-repository] publisher/ is this repo, checked out above at job.workflow_sha; ./ would be the app repo
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: social-posts
          path: out
      - name: Post
        working-directory: publisher
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_GRAPH_VERSION: ${{ inputs.facebook_graph_version }}
        run: npx tsx scripts/post.ts facebook
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: social-result-facebook
          path: out/results
          if-no-files-found: ignore

  instagram:
    name: Instagram
    needs: [generate, approve]
    if: ${{ needs.approve.result == 'success' && contains(inputs.platforms, 'instagram') }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # tag social/posted/<key>/instagram
    env:
      GITHUB_TOKEN: ${{ github.token }}
      SOCIAL_OUT: ${{ github.workspace }}/out
      DRY_RUN: ${{ inputs.dry_run }}
      FORCE: ${{ inputs.force }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: publisher
          persist-credentials: false
      - uses: ./publisher/.github/actions/setup # zizmor: ignore[self-repository] publisher/ is this repo, checked out above at job.workflow_sha; ./ would be the app repo
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: social-posts
          path: out
      - name: Post the Reel
        working-directory: publisher
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_GRAPH_VERSION: ${{ inputs.facebook_graph_version }}
        run: npx tsx scripts/post.ts instagram
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: social-result-instagram
          path: out/results
          if-no-files-found: ignore

  linkedin:
    name: LinkedIn
    needs: [generate, approve]
    if: ${{ needs.approve.result == 'success' && contains(inputs.platforms, 'linkedin') }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # tag social/posted/<key>/linkedin-*
    env:
      GITHUB_TOKEN: ${{ github.token }}
      SOCIAL_OUT: ${{ github.workspace }}/out
      DRY_RUN: ${{ inputs.dry_run }}
      FORCE: ${{ inputs.force }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: publisher
          persist-credentials: false
      - uses: ./publisher/.github/actions/setup # zizmor: ignore[self-repository] publisher/ is this repo, checked out above at job.workflow_sha; ./ would be the app repo
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: social-posts
          path: out
      - name: Post
        working-directory: publisher
        env:
          LINKEDIN_AS: ${{ inputs.linkedin_as }}
          LINKEDIN_VERSION: ${{ inputs.linkedin_version }}
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          LINKEDIN_ORG_URN: ${{ secrets.LINKEDIN_ORG_URN }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
        run: npx tsx scripts/post.ts linkedin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: social-result-linkedin
          path: out/results
          if-no-files-found: ignore

  youtube:
    name: YouTube
    needs: [generate, approve]
    if: ${{ needs.approve.result == 'success' && contains(inputs.platforms, 'youtube') }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # tag social/posted/<key>/youtube
    env:
      GITHUB_TOKEN: ${{ github.token }}
      SOCIAL_OUT: ${{ github.workspace }}/out
      DRY_RUN: ${{ inputs.dry_run }}
      FORCE: ${{ inputs.force }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: publisher
          persist-credentials: false
      - uses: ./publisher/.github/actions/setup # zizmor: ignore[self-repository] publisher/ is this repo, checked out above at job.workflow_sha; ./ would be the app repo
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: social-posts
          path: out
      - name: Upload
        working-directory: publisher
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ inputs.youtube_privacy }}
          YT_AUDITED: ${{ inputs.youtube_audited }}
        run: npx tsx scripts/post.ts youtube
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: social-result-youtube
          path: out/results
          if-no-files-found: ignore

  tiktok:
    name: TikTok
    needs: [generate, approve]
    if: ${{ needs.approve.result == 'success' && contains(inputs.platforms, 'tiktok') }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # tag social/posted/<key>/tiktok
    env:
      GITHUB_TOKEN: ${{ github.token }}
      SOCIAL_OUT: ${{ github.workspace }}/out
      DRY_RUN: ${{ inputs.dry_run }}
      FORCE: ${{ inputs.force }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: publisher
          persist-credentials: false
      - uses: ./publisher/.github/actions/setup # zizmor: ignore[self-repository] publisher/ is this repo, checked out above at job.workflow_sha; ./ would be the app repo
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: social-posts
          path: out
      - name: Upload to the TikTok inbox
        working-directory: publisher
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          SOCIAL_SECRETS_TOKEN: ${{ secrets.SOCIAL_SECRETS_TOKEN }}
          # Outside out/ (which is uploaded): TikTok's new refresh token.
          # (runner.* is only allowed in step env, not job env.)
          TIKTOK_NEW_TOKEN_FILE: ${{ runner.temp }}/tiktok-refresh-token
        run: npx tsx scripts/post.ts tiktok
      # TikTok replaced the refresh token: save the new one, even if the
      # upload failed after the refresh, or the next run can't sign in.
      - name: Save the new TikTok token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.SOCIAL_SECRETS_TOKEN }}
          REPOS: ${{ inputs.tiktok_token_repos || github.repository }}
          TIKTOK_NEW_TOKEN_FILE: ${{ runner.temp }}/tiktok-refresh-token
        run: |
          if [ ! -s "$TIKTOK_NEW_TOKEN_FILE" ]; then
            echo "No token refresh happened; nothing to save."
            exit 0
          fi
          status=0
          IFS=',' read -ra repos <<< "$REPOS"
          for repo in "${repos[@]}"; do
            repo="$(echo "$repo" | tr -d '[:space:]')"
            [ -n "$repo" ] || continue
            if gh secret set TIKTOK_REFRESH_TOKEN --repo "$repo" < "$TIKTOK_NEW_TOKEN_FILE" > /dev/null; then
              echo "Saved the new TIKTOK_REFRESH_TOKEN in $repo."
            else
              echo "::error::Couldn't save TIKTOK_REFRESH_TOKEN in $repo. Check SOCIAL_SECRETS_TOKEN (Secrets: read and write on $repo); otherwise sign in again with scripts/get-tiktok-token.ts."
              status=1
            fi
          done
          rm -f "$TIKTOK_NEW_TOKEN_FILE"
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: social-result-tiktok
          path: out/results
          if-no-files-found: ignore

  threads:
    name: Threads
    needs: [generate, approve]
    if: ${{ needs.approve.result == 'success' && contains(inputs.platforms, 'threads') }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # tag social/posted/<key>/threads
    env:
      GITHUB_TOKEN: ${{ github.token }}
      SOCIAL_OUT: ${{ github.workspace }}/out
      DRY_RUN: ${{ inputs.dry_run }}
      FORCE: ${{ inputs.force }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: publisher
          persist-credentials: false
      - uses: ./publisher/.github/actions/setup # zizmor: ignore[self-repository] publisher/ is this repo, checked out above at job.workflow_sha; ./ would be the app repo
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: social-posts
          path: out
      - name: Post
        working-directory: publisher
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: npx tsx scripts/post.ts threads
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: social-result-threads
          path: out/results
          if-no-files-found: ignore

  summary:
    name: Summary
    needs: [generate, approve, facebook, instagram, linkedin, youtube, tiktok, threads]
    if: ${{ always() && needs.generate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # move social/last-post
    env:
      GITHUB_TOKEN: ${{ github.token }}
      SOCIAL_OUT: ${{ github.workspace }}/out
      DRY_RUN: ${{ inputs.dry_run }}
      PLATFORMS: ${{ inputs.platforms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: publisher
          persist-credentials: false
      - uses: ./publisher/.github/actions/setup # zizmor: ignore[self-repository] publisher/ is this repo, checked out above at job.workflow_sha; ./ would be the app repo
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: social-posts
          path: out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: social-result-*
          path: out/results
